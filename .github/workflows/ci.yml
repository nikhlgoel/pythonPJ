name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy || true
      - name: Test
        run: pytest -q --cov=embra --cov-report=term-missing --cov-fail-under=80

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[all]"
      - name: Examples
        run: |
          python examples/rag_pipeline.py
          python examples/replicated_cluster.py
      - name: Benchmark (small)
        run: python -m embra.bench --n 3000 --dim 64 --queries 50
      - name: CLI
        run: |
          embra create demo --dim 8 --data /tmp/ci-data
          python - <<'PY'
          import json, numpy as np
          rng = np.random.default_rng(0)
          with open("/tmp/docs.jsonl", "w") as fh:
              for i in range(50):
                  fh.write(json.dumps({
                      "id": f"d{i}",
                      "vector": rng.normal(size=8).tolist(),
                      "metadata": {"g": i % 3},
                      "text": f"document {i}",
                  }) + "\n")
          PY
          embra ingest demo /tmp/docs.jsonl --data /tmp/ci-data
          embra query demo --text "document 7" -k 3 --data /tmp/ci-data
          embra stats demo --data /tmp/ci-data
