[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "annex"
version = "0.1.0"
description = "Annex - an embedded, transactional, vector-native search engine written from scratch in Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Annex Contributors" }]
keywords = ["vector-database", "hnsw", "ann", "bm25", "hybrid-search", "lsm-tree", "mvcc", "rag"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database :: Database Engines/Servers",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.6", "httpx>=0.27"]
cli = ["typer>=0.12", "rich>=13.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]
all = ["annex[server,cli,dev]"]

[project.scripts]
annex = "annex.cli:main"

[project.urls]
Homepage = "https://github.com/nikhlgoel/pythonpj"
Documentation = "https://github.com/nikhlgoel/pythonpj/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/annex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:annex.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RET"]
ignore = ["E501", "B008", "SIM108"]

[tool.mypy]
python_version = "3.10"
packages = ["annex"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
